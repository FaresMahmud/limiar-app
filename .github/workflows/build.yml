name: Build Limiar (Windows + macOS)

on:
  # Acionamento manual: em https://github.com/FaresMahmud/limiar-app/actions,
  # clique em "Run workflow" para compilar sob demanda.
  workflow_dispatch:

  # Acionamento automático: a cada push na branch main.
  # Remova a seção abaixo se preferir apenas compilação manual.
  push:
    branches:
      - main
    # Acionamento por tag de versão (ex.: v1.0.0, v1.2.3): além de compilar,
    # anexa automaticamente os instaladores à GitHub Release correspondente.
    tags:
      - 'v*.*.*'

# Necessário para o softprops/action-gh-release conseguir criar/atualizar a
# Release e fazer upload dos instaladores usando o GITHUB_TOKEN.
permissions:
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  # ============================================================================
  # JOB 1: Build para Windows
  # ============================================================================
  build-windows:
    name: Build Windows (.msi/.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Rust (toolchain stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache de dependências Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache de node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: npm install
        run: npm install

      - name: Compilar com Tauri (Windows)
        run: npm run tauri build

      - name: Upload do artifact (.msi e .exe)
        uses: actions/upload-artifact@v4
        with:
          name: limiar-windows
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload do artifact (.exe portável, se existir)
        uses: actions/upload-artifact@v4
        with:
          name: limiar-windows-portable
          path: src-tauri/target/release/bundle/*.exe
          if-no-files-found: warn

      # ----- Publicação na Release (apenas em push de tag vX.Y.Z) -----
      - name: Renomear instalador para nome estável (Windows)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p release-assets
          msi=$(ls src-tauri/target/release/bundle/msi/*.msi | head -n1)
          cp "$msi" "release-assets/limiar-windows-setup.msi"

      - name: Anexar instalador à Release (Windows)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/limiar-windows-setup.msi
          fail_on_unmatched_files: true

  # ============================================================================
  # JOB 2: Build para macOS
  # ============================================================================
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Rust (toolchain stable + alvos Intel e Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache de dependências Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache de node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: npm install
        run: npm install

      # Binário universal: um único .dmg que roda em Macs Intel e Apple Silicon.
      - name: Compilar com Tauri (macOS universal)
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload do artifact (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: limiar-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      # ----- Publicação na Release (apenas em push de tag vX.Y.Z) -----
      - name: Renomear instalador para nome estável (macOS)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p release-assets
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
          cp "$dmg" "release-assets/limiar-macos.dmg"

      - name: Anexar instalador à Release (macOS)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/limiar-macos.dmg
          fail_on_unmatched_files: true

  # ============================================================================
  # JOB 3: Sumário final (opcional, apenas informativo)
  # ============================================================================
  summary:
    name: Build Completo ✓
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Build bem-sucedido
        run: |
          echo "✅ Build concluído com sucesso!"
          echo "Acesse a aba 'Artifacts' desta execução para baixar os instaladores:"
          echo "  - Windows: limiar-windows (arquivo .msi)"
          echo "  - macOS: limiar-macos (arquivo .dmg)"
